name: Score artifacts
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify artifacts, collision detector and real-font density
        id: gate
        run: |
          mkdir -p .tmp
          set -o pipefail
          npm run check:ci 2>&1 | tee .tmp/notation-density.log
      - name: Annotate gate failure
        if: failure() && steps.gate.outcome == 'failure'
        shell: python
        run: |
          from pathlib import Path
          log = Path('.tmp/notation-density.log').read_text()
          detail = log[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Score verification failure::{detail}')
      - name: Upload notation density report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notation-density-report
          path: |
            .tmp/notation-density/report.json
            .tmp/notation-density.log
          include-hidden-files: true
          if-no-files-found: ignore
