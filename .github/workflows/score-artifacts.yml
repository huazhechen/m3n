name: Score artifacts
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: node --test tools/score-artifacts.test.mjs
      - run: npm run check:score-artifacts
      - run: npx playwright install --with-deps chromium
      - name: Verify notation density with real fonts
        run: M3N_MEMORY_LIMIT_MB=1750 python3 tools/run-low-memory.py node tools/compare-notation-density.mjs --regression
